minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.0'
  - '@tanstack/react-query@5.105.0'
  - autoprefixer@10.6.2
  - ox@0.14.59
  - postcss@8.5.32
  - viem@2.57.12
  - lucide-react@1.62.0

overrides:
  use-sync-external-store@1.2.0: 1.4.0
  dompurify: 3.4.17
  happy-dom: 21.0.4
  ws@^8: 8.22.0
  decode-uri-component: 0.5.1
  abitype@^1: 1.3.0

# Keep unreviewed dependency scripts fatal in local and hosted installs.
strictDepBuilds: true
allowBuilds:
  # Reviewed platform-binary installers needed by tsx and migration tooling.
  'esbuild@0.18.20 || 0.25.12 || 0.28.2': true
  # Optional native builds: these packages provide working JS fallbacks.
  'bufferutil@4.1.0': false
  'keccak@3.0.4': false
  'utf-8-validate@5.0.10': false
