name: Verify foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncrate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SERVER_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/syncrate_test
      PAYLOAD_SECRET: ci-only-disposable-test-secret-never-use-for-production-123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cms:types
      - run: pnpm cms:importmap
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify historical holdings when archive RPC is configured
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        timeout-minutes: 60
        env:
          POINTS_RPC_URL: ${{ secrets.POINTS_RPC_URL }}
        run: |
          if [ -z "$POINTS_RPC_URL" ]; then
            echo '::notice::POINTS_RPC_URL is not configured. Live historical holdings and LP acceptance remain pending.'
          else
            node --import tsx scripts/probe-points-history.ts
            node scripts/calculate-week.cjs --verify-current
          fi
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:integration
        env:
          DATABASE_SCHEMA: cms
      - run: pnpm build
