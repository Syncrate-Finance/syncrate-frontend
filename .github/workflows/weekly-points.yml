name: Weekly Sync Points

on:
  schedule:
    - cron: '30 0 * * 0'
  workflow_dispatch:

jobs:
  calculate-points:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <-- add this

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run points calculation
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: node scripts/calculate-week.js

      - name: Commit and push updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/points/latest.json public/points/week-*.json || true
          git diff --staged --quiet || git commit -m "points: weekly update $(date -u +%Y-%m-%d)"
          git push
